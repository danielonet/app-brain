name: Publish

# Publishes to the Visual Studio Marketplace when a version tag (vX.Y.Z) is pushed.
# The version is the one in packages/brain-vscode/package.json (the extension manifest).
# Release flow:  npm version patch --workspace packages/brain-vscode --no-git-tag-version
#                git commit -am "Release vX.Y.Z" && git tag vX.Y.Z
#                git push --follow-tags
#
# One-time setup (outside this repo): a Marketplace publisher whose id matches the
# "publisher" field in packages/brain-vscode/package.json, with this repository and
# workflow configured as a trusted publisher. The publisher is danielonnet; the policy "app brain workflow" points at this file (publish.yml).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write # to attach the .vsix to a GitHub release
  id-token: write # OIDC token for Marketplace trusted publishing

jobs:
  publish:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # node:sqlite needs 22.16+
          cache: npm
      - run: npm ci

      - name: Check tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./packages/brain-vscode/package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/brain-vscode/package.json version $PKG" >&2
            exit 1
          fi

      - name: Install Chromium for the webview tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm test

      - name: Package
        run: scripts/build-and-install.sh --package-only

      - name: Publish to Visual Studio Marketplace
        # A manual run (workflow_dispatch) only tests and packages; publishing needs a version tag.
        if: startsWith(github.ref, 'refs/tags/v')
        # Trusted publishing: authenticates via the job's GitHub OIDC token (no PAT).
        run: npx --yes @vscode/vsce@latest publish --oidc --packagePath app-brain.vsix

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app-brain.vsix --generate-notes
